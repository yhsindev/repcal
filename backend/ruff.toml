line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "ASYNC", # async issues
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "RUF001", # ambiguous unicode (strings) — CJK fullwidth punctuation is intentional
    "RUF002", # ambiguous unicode (docstrings)
    "RUF003", # ambiguous unicode (comments)
]

[lint.per-file-ignores]
"tests/*" = ["B"]

[format]
quote-style = "double"
indent-style = "space"
